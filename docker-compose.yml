services:
  postgres:
    image: postgres:16-alpine
    container_name: neurovision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: neurovision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - neurovision-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neurovision"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  neurovision-postgres-data:
